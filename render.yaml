# One free web service runs everything on the test track: the school API, the console API, the school admin (at /) and the console (at /console/).
# Connect this repository in Render (New > Blueprint) and fill in the values marked "sync: false" when asked. Steps: docs/deploy-free-test.md
services:
  - type: web
    name: tangent
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    # corepack enable writes shims to /usr/bin (EROFS on Render). Use `corepack pnpm` instead.
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && CONSOLE_BASE=/console/ corepack pnpm exec turbo run build --concurrency=2 --env-mode=loose
    startCommand: node apps/server/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # A Neon database for the registry (the list of schools). Use the direct connection string, not the pooled one. Schools'
      # databases are made on this server too, unless a cell is given a School databases connection in the console.
      - key: REGISTRY_DATABASE_URL
        sync: false
      # Generated once by Render. Changing SECRETS_KEY later makes every school's stored connection unreadable.
      - key: SECRETS_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # How you sign in to the console. The password is generated; read it under Environment once the service exists.
      - key: BOOTSTRAP_EMAIL
        value: kaushal@tangent.app
      - key: BOOTSTRAP_PASSWORD
        generateValue: true
      # The six-digit code the console asks for after the password. There is no email service on the test track, so you choose it.
      - key: DEMO_CODE
        sync: false
      - key: SEED_DEMO
        value: "true"
      # Production refuses SEED_DEMO and DEMO_CODE unless this says the service is a demo/test track.
      - key: ALLOW_DEMO
        value: "true"
      # No CORS_ORIGINS here: the server always allows its own Render address (RENDER_EXTERNAL_URL), whatever the service is called.
      # Add CORS_ORIGINS in Render only for other origins, such as a custom domain.
