      <div class="col" style="gap:4px"><span class="lbl">Late</span><span class="fig" style="font-size:44px;color:var(--warn-d)">{{n.l}}</span></div>

      </div>
    </section>
    <div class="g" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const N = ["Aarav Sharma", "Aditi Rao", "Advait Joshi", "Anika Verma", "Arnav Desai", "Avni Kapoor", "Dhruv Mehta", "Diya Nair", "Eshan Gupta", "Fatima Khan", "Gauri Patil", "Harsh Agarwal", "Ira Menon", "Ishaan Reddy", "Jiya Shah", "Kavya Iyer", "Krish Malhotra", "Lavanya Pillai", "Manav Chopra", "Meera Kulkarni", "Neil Pinto", "Nitya Bhatt", "Om Deshpande", "Pari Saxena", "Reyansh Singh", "Riya Banerjee", "Samar Qureshi", "Tara Fernandes", "Vihaan Jain", "Yash Pawar", "Zara Sheikh", "Zoya Shaikh"];
  const first = N.map((_, i) => (i === 12 || i === 31 ? "A" : i === 5 ? "L" : i >= 26 && i <= 30 ? "" : "P"));
  const m = (this.state && this.state.m) || first;
  const set = (i, v) => () => this.setState({ m: m.map((x, j) => (j === i ? (x === v ? "" : v) : x)) });
  const n = { p: 0, l: 0, a: 0, u: 0 };
  m.forEach((v) => n[v === "P" ? "p" : v === "L" ? "l" : v === "A" ? "a" : "u"]++);
  return {
    n,
    note: n.u ? n.u + " still to mark before you can save" : "Everyone is marked. Saving texts " + n.a + " " + (n.a === 1 ? "family" : "families") + ".",
    all: () => this.setState({ m: m.map(() => "P") }),
    cells: N.map((name, i) => ({ n: name, p: "pk" + (m[i] === "P" ? " ok" : ""), l: "pk" + (m[i] === "L" ? " warn" : ""), a: "pk" + (m[i] === "A" ? " bad" : ""), ip: m[i] === "P", il: m[i] === "L", ia: m[i] === "A", gp: set(i, "P"), gl: set(i, "L"), ga: set(i, "A") })),
  };
}
}
</script>
