<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timetable</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hue.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&amp;family=Noto+Sans+Devanagari:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="hue s-emerald shell">
  <div class="sidew"><dc-import name="Sidebar" app="admin" active="Timetable" theme="light" seed="emerald" hint-size="248px,940px"></dc-import></div>
  <main class="main">
    <header class="top">
      <div><h1>Timetable</h1><p>8 A · Class teacher Kavita Iyer · Room 204</p></div>
      <span class="sp"></span>
      <div class="seg"><span class="on">Class</span><span>Teacher</span><span>Room</span></div>
      <button class="btn"><svg class="i" viewBox="0 0 256 256" aria-hidden="true"><path d="M214.8 72L200 72L200 40Q200 36.8 197.6 34.4Q195.3 32 192 32L192 32L64 32Q60.8 32 58.4 34.4Q56 36.8 56 40L56 40L56 72L41.3 72Q30.8 72 23.4 79Q16 86 16 96L16 176Q16 179.3 18.4 181.6Q20.8 184 24 184L24 184L56 184L56 216Q56 219.3 58.4 221.6Q60.8 224 64 224L64 224L192 224Q195.3 224 197.6 221.6Q200 219.3 200 216L200 216L200 184L232 184Q235.3 184 237.6 181.6Q240 179.3 240 176L240 176L240 96Q240 86 232.6 79Q225.3 72 214.8 72ZM72 48L184 48L184 72L72 72ZM184 208L72 208L72 160L184 160ZM224 168L200 168L200 152Q200 148.8 197.6 146.4Q195.3 144 192 144L192 144L64 144Q60.8 144 58.4 146.4Q56 148.8 56 152L56 152L56 168L32 168L32 96Q32 92.8 34.8 90.4Q37.5 88 41.3 88L214.8 88Q218.5 88 221.3 90.4Q224 92.8 224 96ZM200 116Q200 121 196.5 124.5Q193 128 188 128Q183 128 179.5 124.5Q176 121 176 116Q176 111 179.5 107.5Q183 104 188 104L188 104Q193 104 196.5 107.5Q200 111 200 116Z"/></svg>Print</button>
      <button class="btn pri"><svg class="i" viewBox="0 0 256 256" aria-hidden="true"><path d="M227.3 73.3L182.8 28.8Q180.5 26.5 177.6 25.3Q174.8 24 171.3 24Q168 24 165.1 25.3Q162.3 26.5 160 28.8L36.8 152Q34.5 154.3 33.3 157.1Q32 160 32 163.3Q32 163.3 32 163.3Q32 163.3 32 163.3L32 163.3L32 208Q32 214.8 36.6 219.4Q41.3 224 48 224L48 224L92.8 224Q92.8 224 92.8 224Q92.8 224 92.8 224Q96 224 98.9 222.8Q101.8 221.5 104 219.3L227.3 96Q229.5 93.8 230.8 90.9Q232 88 232 84.8Q232 81.3 230.8 78.4Q229.5 75.5 227.3 73.3L227.3 73.3ZM92.8 208L48 208L48 163.3L136 75.3L180.8 120ZM192 108.8L147.3 64L171.3 40L216 84.8Z"/></svg>Edit week</button>
    </header>
    <section class="card">
      <div class="tt" style="grid-template-columns:72px repeat(6,minmax(0,1fr))">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="60"><div class="{{c.cls}}"><b>{{c.a}}</b><small>{{c.b}}</small></div></sc-for>
      </div>
    </section>
    <div class="g" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
      <section class="card">
        <div class="ch"><h2>Periods this week</h2><small>40 taught, 2 free on Saturday</small></div>
        <div class="rw" style="gap:6px;flex-wrap:wrap"><sc-for list="{{legend}}" as="l" hint-placeholder-count="11"><span class="{{l.cls}}"><i class="dot"></i>{{l.t}} · {{l.n}}</span></sc-for></div>
      </section>
      <section class="card">
        <div class="ch"><h2>Changes this week</h2></div>
        <div class="rows">
          <div class="row" style="min-height:48px"><span class="tile date"><small>Thu</small>12</span><span class="grow"><b>Period 7 ends at 1:50</b><small>Parent teacher meeting starts at 4:00</small></span></div>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const T = { English: ["english", "Ms Thomas"], Science: ["science", "Mr Rao"], Maths: ["maths", "Ms Iyer"], Hindi: ["hindi", "Ms Tiwari"], Marathi: ["marathi", "Mr Jadhav"], "Social science": ["social", "Ms Banerjee"], Computers: ["computers", "Mr Khan"], Sport: ["sport", "Mr Pawar"], Art: ["art", "Ms Sen"], Music: ["music", "Mr Kale"], Sanskrit: ["sanskrit", "Ms Joshi"] };
  const S = "Social science";
  const week = [
    ["8:00", "P1", ["English", "Science", "Maths", "Hindi", "English", "Sport"]],
    ["8:45", "P2", ["Maths", "English", "Science", "Maths", "Science", "Sport"]],
    ["9:30", "P3", ["Science", "Maths", "English", "Science", "Maths", "Art"]],
    ["10:15", "", "Break · 20 minutes"],
    ["10:35", "P4", ["Hindi", "Marathi", "Hindi", "English", "Marathi", "Music"]],
    ["11:20", "P5", [S, "Computers", S, "Marathi", S, "Computers"]],
    ["12:05", "", "Lunch · 40 minutes"],
    ["12:45", "P6", ["Marathi", S, "Art", "Computers", "Hindi", ""]],
    ["1:30", "P7", ["Sport", "Hindi", "Music", S, "Sanskrit", ""]],
  ];
  const cells = [{ cls: "th", a: "", b: "" }, ...["Mon 9", "Tue 10", "Wed 11", "Thu 12", "Fri 13", "Sat 14"].map((a, i) => ({ cls: i === 1 ? "th on" : "th", a, b: "" }))];
  const count = {};
  week.forEach(([time, p, row]) => {
    cells.push({ cls: "tm", a: time, b: p });
    if (typeof row === "string") return cells.push({ cls: "per brk", a: row, b: "" });
    row.forEach((s, d) => {
      if (!s) return cells.push({ cls: "per free", a: "Free", b: "Half day" });
      count[s] = (count[s] || 0) + 1;
      cells.push({ cls: "per sp-" + T[s][0] + (p === "P3" && d === 1 ? " now" : ""), a: s, b: T[s][1] + (p === "P3" && d === 1 ? " · now" : "") });
    });
  });
  return { cells, legend: Object.keys(T).map((t) => ({ cls: "tag sp sp-" + T[t][0], t, n: count[t] || 0 })) };
}
}
</script>
</body>
</html>
