      try { var t = localStorage.getItem('gradeon.theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); if (document.documentElement.dataset.theme === 'dark') document.documentElement.style.background = '#07060B'; } catch (e) {}
