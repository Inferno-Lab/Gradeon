name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'redesign/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform (build, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node tools/check-name.mjs
      - run: node tools/check-migrations.mjs origin/main
      - run: pnpm install --frozen-lockfile
      - run: CONSOLE_BASE=/console/ pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  browser:
    name: Browser flows and page audit (admin, console)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the database, the server and the demo school
        run: bash tools/dev-reset.sh
      # The flows use the dev servers; this is how Render serves the built admin and console (a library update broke it once).
      - name: The server serves the built admin and console
        run: for u in / /s/greenfield /console/ /console/schools; do curl -sf -o /dev/null http://127.0.0.1:4000$u || { echo "GET $u failed"; tail -20 /tmp/server.log; exit 1; }; done
      - name: Start the admin and the console
        run: |
          nohup pnpm --filter @tangent/admin dev --host 127.0.0.1 > /tmp/admin.log 2>&1 &
          nohup pnpm --filter @tangent/console dev --host 127.0.0.1 > /tmp/console.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ >/dev/null && curl -sf http://127.0.0.1:5174/ >/dev/null && exit 0; sleep 2; done; exit 1
      - run: node tools/e2e-flows.mjs /tmp/e2e
      - name: Page audit on fresh data
        run: bash tools/dev-reset.sh && node tools/audit-ui.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            /tmp/e2e
            /tmp/*.log

  flutter:
    name: Flutter app (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter test
