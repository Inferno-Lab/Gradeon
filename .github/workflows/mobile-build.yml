name: Mobile build
# Started by the console ("Build Android app" on a school) with the school's address name and the build's id.
on:
  workflow_dispatch:
    inputs:
      school:
        description: The school's address name, like greenfield
        required: true
      build_id:
        description: The console's id for this build
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      BUILD_CALLBACK_TOKEN: ${{ secrets.BUILD_CALLBACK_TOKEN }}
      TAG: app-${{ inputs.school }}-${{ inputs.build_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Leave the sample content out
        # A school's app only talks to its school; the sample content and its code never ship (InitialBinding drops it in release too).
        run: sed -i '\#- assets/mock/#d' pubspec.yaml && rm -rf assets/mock && ! grep -q 'assets/mock' pubspec.yaml
      - name: The school's name and logo on the phone
        # From the school's brand (set in the console): its short name under the icon, its logo as the icon and splash mark.
        # Without a logo the Gradeon icon stays.
        if: env.API_BASE_URL != ''
        run: |
          BRAND=$(curl -fsS -H "x-school: ${{ inputs.school }}" "${API_BASE_URL%/}/v1/brand")
          NAME=$(echo "$BRAND" | jq -r '.shortName // empty' | sed 's/[&<>"]//g')
          LOGO=$(echo "$BRAND" | jq -r '.logoUrl // empty')
          if [ -n "$NAME" ]; then sed -i "s#android:label=\"Gradeon\"#android:label=\"$NAME\"#" android/app/src/main/AndroidManifest.xml; fi
          if [ -n "$LOGO" ]; then
            curl -fsSL "$LOGO" -o /tmp/logo
            rm -rf android/app/src/main/res/mipmap-anydpi-v26  # the adaptive Gradeon icon would win over the school's
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              convert /tmp/logo -resize "${d#*:}x${d#*:}^" -gravity center -extent "${d#*:}x${d#*:}" "android/app/src/main/res/mipmap-${d%%:*}/ic_launcher.png"
            done
          fi
      - run: flutter pub get
      - name: Build the school's app
        run: flutter build apk --release --dart-define=SCHOOL=${{ inputs.school }} --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Publish the install link
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "${{ inputs.school }}.apk"
          gh release create "$TAG" "${{ inputs.school }}.apk" --prerelease --title "App for ${{ inputs.school }}" --notes "Built for the console. Install on an Android phone."
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/${{ inputs.school }}.apk" >> "$GITHUB_OUTPUT"
      - name: Tell the console
        if: always() && env.API_BASE_URL != ''
        run: |
          OK=${{ job.status == 'success' }}
          curl -fsS -X POST "${API_BASE_URL%/}/console/v1/builds/${{ inputs.build_id }}/finish" \
            -H "x-build-token: ${BUILD_CALLBACK_TOKEN}" -H "content-type: application/json" \
            -d "{\"ok\": ${OK}, \"url\": \"${{ steps.publish.outputs.url }}\"}"
